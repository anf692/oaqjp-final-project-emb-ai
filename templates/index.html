
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detection</title>
</head>
<body>
    <h1>Emotion Detection Application</h1>

    <label for="textToAnalyze">Enter your text:</label>
    <input
        type="text"
        id="textToAnalyze"
        placeholder="I think I am having fun"
    >

    <button onclick="analyzeEmotion()">Analyze</button>

    <p id="result"></p>

    <script>
        function analyzeEmotion() {
            const text = document.getElementById("textToAnalyze").value;

            fetch(`/emotionDetector?textToAnalyze=${encodeURIComponent(text)}`)
                .then(response => response.text())
                .then(data => {
                    document.getElementById("result").textContent = data;
                });
        }
    </script>
</body>
</html>
